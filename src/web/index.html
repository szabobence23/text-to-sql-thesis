<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Text-to-SQL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b9cff' stroke-width='2' stroke-linecap='round'%3E%3Cellipse cx='12' cy='5' rx='8' ry='3'/%3E%3Cpath d='M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5'/%3E%3Cpath d='M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="logo" data-icon="database"></span>
          <span>Text-to-SQL</span>
        </div>
        <button class="icon-btn" id="close-sidebar" title="Oldalsáv bezárása" data-icon="panel"></button>
      </div>

      <button class="new-chat" id="new-chat">
        <span data-icon="edit"></span>
        <span>Új beszélgetés</span>
      </button>

      <div class="history-label">Előzmények</div>
      <nav class="history" id="history"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="open-sidebar" title="Oldalsáv megnyitása" data-icon="panel"></button>
        <div class="dataset" id="dataset">
          <button class="dataset-btn" id="dataset-btn" type="button" aria-haspopup="menu" aria-expanded="false"
                  title="Melyik adatbázisról kérdezel?">
            <span class="dataset-icon" data-icon="database"></span>
            <span class="dataset-caption">Adatbázis</span>
            <span class="dataset-name" id="dataset-name"></span>
            <span class="dataset-chevron" data-icon="chevron"></span>
          </button>
          <div class="dataset-menu" id="dataset-menu" role="menu"></div>
        </div>
      </header>

      <section class="chat" id="chat">
        <div class="empty" id="empty">
          <div class="empty-logo" data-icon="database"></div>
          <h1>Miről kérdeznél?</h1>
          <p id="empty-description">Kérdezz természetes nyelven: SQL-t írok belőle, lefuttatom, és elmondom az eredményt.</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
        <div class="thread" id="thread"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Kérdezz az adatbázisról…" autocomplete="off"></textarea>
          <button type="submit" class="send" id="send" title="Küldés (Enter)" data-icon="arrow" disabled></button>
        </form>
        <div class="disclaimer">A választ egy helyi nyelvi modell generálja. Az SQL a „Részletek” alatt ellenőrizhető.</div>
      </footer>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
