[tool.pytest.ini_options]
# The modules in src/ import each other flat (from schema import ...),
# so tests put src/ on sys.path the same way the scripts do; finetune/
# for the fine-tuning data scripts (test_finetune.py).
pythonpath = ["src", "finetune"]
testpaths = ["src/tests"]
markers = [
    "db: needs the PostgreSQL container with the dataset databases (setup_dataset.py)",
]
